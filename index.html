<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maiko.TS | Info</title>
  <meta name="description" content="Informacoes e link para meus outros perfis">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg1: #1a1a2e;
      --bg2: #16213e;
      --accent: #a855f7;
      --accent2: #ec4899;
      --card: rgba(255, 255, 255, 0.06);
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid transparent;
      background: linear-gradient(var(--bg1), var(--bg1)) padding-box,
                  linear-gradient(135deg, var(--accent), var(--accent2)) border-box;
      margin-bottom: 20px;
    }

    h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
    .username { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }

    .bio {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #cbd5e1;
      margin-bottom: 24px;
      padding: 0 10px;
    }

    /* STATS */
    .stats { display: flex; gap: 10px; margin-bottom: 24px; }

    .stat-chip, .like-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 0.9rem;
      color: var(--muted);
      backdrop-filter: blur(10px);
      font-family: inherit;
      position: relative;
      overflow: hidden;
    }

    .stat-chip strong, .like-btn strong {
      color: var(--text);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .stat-chip i { color: var(--accent); font-size: 1rem; }

    .like-btn { cursor: pointer; transition: all 0.25s ease; }
    .like-btn i { color: var(--muted); font-size: 1rem; transition: all 0.3s ease; }

    .like-btn:hover {
      border-color: rgba(236, 72, 153, 0.5);
      transform: translateY(-2px);
    }

    .like-btn.liked {
      background: rgba(236, 72, 153, 0.15);
      border-color: rgba(236, 72, 153, 0.6);
      animation: likeGlow 2s ease-in-out infinite;
    }

    .like-btn.liked i, .like-btn.liked strong { color: #fbcfe8; }
    .like-btn.liked i { animation: heartPop 0.4s ease; }

    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    @keyframes likeGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(236, 72, 153, 0); }
      50% { box-shadow: 0 0 20px 0 rgba(236, 72, 153, 0.3); }
    }

    /* LINKS */
    .links { display: flex; flex-direction: column; gap: 14px; }

    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      font-size: 1rem;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      animation: fadeInUp 0.5s ease backwards;
    }

    .link:nth-child(1) { animation-delay: 0.10s; }
    .link:nth-child(2) { animation-delay: 0.18s; }
    .link:nth-child(3) { animation-delay: 0.26s; }
    .link:nth-child(4) { animation-delay: 0.34s; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .link i { font-size: 1.3rem; width: 26px; text-align: center; }

    .link:hover {
      transform: translateY(-3px);
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(168, 85, 247, 0.35);
    }

    .link:active { transform: translateY(-1px) scale(0.98); }

    /* COMPARTILHAR */
    .share-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      padding: 14px 20px;
      width: 100%;
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .share-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(168, 85, 247, 0.08);
      transform: translateY(-2px);
    }

    .share-btn:active { transform: translateY(0) scale(0.98); }

    footer { margin-top: 40px; font-size: 0.8rem; color: var(--muted); }

    .inapp-banner {
      display: none;
      margin-bottom: 20px;
      padding: 12px 16px;
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.4);
      border-radius: 12px;
      font-size: 0.85rem;
      color: #fbcfe8;
      line-height: 1.4;
    }
    .inapp-banner.show { display: block; }
    .inapp-banner button {
      margin-top: 8px;
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out;
      pointer-events: none;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(30, 30, 46, 0.95);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
      z-index: 1000;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="inapp-banner" id="inappBanner">
      Você está no navegador do Instagram. Para abrir os apps corretamente, toque em <b>⋮ → Abrir no navegador</b>.
      <br>
      <button onclick="copyLink()">Copiar link</button>
    </div>

    <img class="avatar" src="assets/ft_perfil/maikots.ofc.png" alt="Foto de perfil">

    <h1>Maiko Tavares</h1>
    <p class="username">@maikots.ofc</p>
    <p class="bio">
      Dev/Modder/Android<br>
      Quebrando as limitações<br>
      📍 Ceará, Brasil
    </p>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-chip" title="Visitas no site">
        <i class="fa-solid fa-eye"></i>
        <strong id="visitCount">—</strong>
      </div>
      <button class="like-btn" id="likeBtn" type="button" title="Curtir perfil">
        <i class="fa-regular fa-heart" id="likeIcon"></i>
        <strong id="likeCount">—</strong>
      </button>
    </div>

    <div class="links">

      <!-- INSTAGRAM -->
      <a class="link"
         href="https://www.instagram.com/maikots.ofc"
         data-deeplink="instagram://user?username=maikots.ofc"
         data-android="intent://www.instagram.com/maikots.ofc/#Intent;package=com.instagram.android;scheme=https;end"
         target="_blank" rel="noopener">
        <i class="fa-brands fa-instagram"></i>
        <span>Instagram</span>
      </a>

      <!-- YOUTUBE -->
      <a class="link"
         href="https://youtube.com/@maikots"
         data-deeplink="vnd.youtube://channel/UCjiRpNFwjzChM_WOtT9ZudQ"
         data-android="intent://channel/UCjiRpNFwjzChM_WOtT9ZudQ#Intent;scheme=vnd.youtube;package=com.google.android.youtube;S.browser_fallback_url=https%3A%2F%2Fyoutube.com%2F%40maikots;end"
         target="_blank" rel="noopener">
        <i class="fa-brands fa-youtube"></i>
        <span>YouTube</span>
      </a>

      <!-- WHATSAPP -->
      <a class="link"
         href="https://wa.me/558592683680"
         data-deeplink="whatsapp://send?phone=558592683680"
         target="_blank" rel="noopener">
        <i class="fa-brands fa-whatsapp"></i>
        <span>WhatsApp</span>
      </a>

      <!-- E-MAIL -->
      <a class="link" href="mailto:maiko.t.s.ofc@gmail.com">
        <i class="fa-solid fa-envelope"></i>
        <span>E-mail</span>
      </a>

    </div>

    <button class="share-btn" id="shareBtn" type="button">
      <i class="fa-solid fa-share-nodes"></i>
      Compartilhar este perfil
    </button>

    <footer>© 2026 MAIKOTS</footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ================= TOAST ================= */
    let toastTimer;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    /* ================= INAPP BANNER ================= */
    const ua = navigator.userAgent || '';
    const isInApp = /Instagram|FBAN|FBAV|FB_IAB|TikTok/i.test(ua);

    if (isInApp) {
      document.getElementById('inappBanner').classList.add('show');
    }

    function copyLink() {
      const url = window.location.href;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => showToast('Link copiado! 📋'));
      } else {
        prompt('Copie o link:', url);
      }
    }

    /* ================= CONTADOR + LIKES (Abacus) ================= */
    const NS  = 'maikots-social-biu';
    const API = 'https://abacus.jasoncameron.dev';

    // -- VISITAS (global no servidor) --
    (async function initVisits() {
      const el = document.getElementById('visitCount');
      try {
        let url;
        if (sessionStorage.getItem('maikots_visited')) {
          url = `${API}/get/${NS}/visits`;
        } else {
          url = `${API}/hit/${NS}/visits`;
          sessionStorage.setItem('maikots_visited', '1');
        }
        const res  = await fetch(url);
        const data = await res.json();
        if (data && typeof data.value === 'number') {
          el.textContent = data.value.toLocaleString('pt-BR');
        } else {
          el.textContent = '0';
        }
      } catch (e) {
        el.textContent = '—';
      }
    })();

    // -- CURTIDAS (global no servidor) --
    (async function initLikes() {
      const btn   = document.getElementById('likeBtn');
      const icon  = document.getElementById('likeIcon');
      const count = document.getElementById('likeCount');
      const hasLiked = () => localStorage.getItem('maikots_liked') === '1';

      if (hasLiked()) {
        btn.classList.add('liked');
        icon.classList.remove('fa-regular');
        icon.classList.add('fa-solid');
      }

      // Lê a contagem GLOBAL do servidor
      try {
        const res  = await fetch(`${API}/get/${NS}/likes`);
        const data = await res.json();
        if (data && typeof data.value === 'number') {
          count.textContent = data.value.toLocaleString('pt-BR');
        } else {
          count.textContent = '0';
        }
      } catch (e) {
        count.textContent = '0';
      }

      btn.addEventListener('click', async () => {
        if (hasLiked()) {
          showToast('Você já curtiu! ❤️');
          return;
        }
        localStorage.setItem('maikots_liked', '1');
        btn.classList.add('liked');
        icon.classList.remove('fa-regular');
        icon.classList.add('fa-solid');

        try {
          const res  = await fetch(`${API}/hit/${NS}/likes`);
          const data = await res.json();
          if (data && typeof data.value === 'number') {
            count.textContent = data.value.toLocaleString('pt-BR');
          }
          showToast('Obrigado pela curtida! ❤️');
        } catch (e) {
          const cur = parseInt(count.textContent.replace(/\D/g, '')) || 0;
          count.textContent = (cur + 1).toLocaleString('pt-BR');
          showToast('Obrigado pela curtida! ❤️');
        }
      });
    })();

    /* ================= COMPARTILHAR ================= */
    document.getElementById('shareBtn').addEventListener('click', async () => {
      const data = {
        title: 'Maiko.TS | Info',
        text:  'Confira meus links!',
        url:   window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(data); } catch (e) { /* cancelado */ }
      } else {
        try {
          await navigator.clipboard.writeText(window.location.href);
          showToast('Link copiado! 📋');
        } catch (e) {
          prompt('Copie o link:', window.location.href);
        }
      }
    });

    /* ================= RIPPLE ================= */
    document.querySelectorAll('.link, .like-btn, .share-btn').forEach(el => {
      el.addEventListener('click', function (e) {
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top  = (e.clientY - rect.top  - size / 2) + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    });

    /* ================= DEEP LINKS ================= */
    document.querySelectorAll('a[data-deeplink]').forEach(link => {
      link.addEventListener('click', function (e) {
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (!isMobile) return;
        if (isInApp) return;

        e.preventDefault();
        let targetUrl = this.dataset.deeplink;
        if (/Android/i.test(navigator.userAgent) && this.dataset.android) {
          targetUrl = this.dataset.android;
        }
        const fallbackUrl = this.href;
        window.location.href = targetUrl;
        setTimeout(() => { window.location.href = fallbackUrl; }, 1500);
      });
    });
  </script>
</body>
